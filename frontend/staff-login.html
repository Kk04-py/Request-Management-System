<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Staff Login - Campus Request Management System
    </title>

    <link
        rel="stylesheet"
        href="staff-login.css">

</head>


<body>

    <main class="staff-login-page">

        <!-- =====================================================
             LOGIN CARD
             ===================================================== -->

        <section class="staff-login-card">


            <!-- HEADER -->

            <div class="staff-login-header">

                <div class="staff-login-icon">
                    S
                </div>

                <h1>
                    Staff Login
                </h1>

                <p>
                    Campus Request Management System
                </p>

            </div>


            <!-- =================================================
                 LOGIN FORM
                 ================================================= -->

            <form
                id="staffLoginForm"
                onsubmit="loginStaff(event)">


                <!-- EMAIL -->

                <div class="staff-login-group">

                    <label for="staffLoginEmail">
                        Official Email
                    </label>

                    <input
                        type="email"
                        id="staffLoginEmail"
                        placeholder="Enter your official .edu email"
                        autocomplete="email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="staff-login-group">

                    <label for="staffLoginPassword">
                        Password
                    </label>

                    <div class="staff-password-wrapper">

    <input
        type="password"
        id="staffLoginPassword"
        placeholder="Enter your password"
        autocomplete="current-password"
        required>

    <button
        type="button"
        class="password-toggle"
        id="passwordToggle"
        onclick="toggleStaffPassword()"
        aria-label="Show password"
        title="Show password">

        <svg
            id="passwordEyeIcon"
            xmlns="http://www.w3.org/2000/svg"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>

            <circle
                cx="12"
                cy="12"
                r="3">
            </circle>

        </svg>

    </button>

</div>

                </div>


                <!-- ERROR / SUCCESS MESSAGE -->

                <div
                    id="staffLoginMessage"
                    class="staff-login-message">
                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="staffLoginButton"
                    class="staff-login-button">

                    Sign In

                </button>


            </form>


            <!-- =================================================
                 INFORMATION
                 ================================================= -->

            <div class="staff-login-info">

                <p>
                    Use the temporary password provided by the
                    administrator for your first login.
                </p>

            </div>


            <!-- BACK -->

            <a
                href="signin.html"
                class="back-to-signin">

                ← Back to Sign In

            </a>


        </section>

    </main>


    <script src="staff-login.js"></script>

</body>

</html>
